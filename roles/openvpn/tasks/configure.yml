---

- name: create openvpn directories
  when:
    - not running_in_check_mode
  bodsch.core.directories:
    owner: "{{ openvpn_owner }}"
    group: "{{ openvpn_group }}"
    mode: "0755"
    paths:
      - path: "{{ openvpn_directory }}/keys"
      - path: "{{ openvpn_logging.directory }}"
  tags:
    - setup
    - openvpn

- name: create management access group
  when:
    - not running_in_check_mode
    - openvpn_server.management.client_group | default('') | string | length > 0
  ansible.builtin.group:
    name: "{{ openvpn_server.management.client_group }}"
    system: true

- name: create a combined client list
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.set_fact:
    openvpn_client_list: "{{ openvpn_client_list | default([]) | bodsch.core.openvpn_clients(hostvars[item]) }}"
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    loop_var: item
  no_log: true
  tags:
    - setup
    - openvpn

- name: management password
  when:
    - not running_in_check_mode
    - openvpn_type == "server"
    - openvpn_server.management.password | default('') | string | length > 0
  ansible.builtin.copy:
    dest: /etc/openvpn/server/mgmt.pass
    content: "{{ openvpn_server.management.password }}"
    owner: "{{ openvpn_owner }}"
    group: "{{ openvpn_group }}"
    mode: "0600"
  no_log: true
  tags:
    - setup
    - openvpn

- name: configure openvpn server
  when:
    - not running_in_check_mode
    - openvpn_type == "server"
  ansible.builtin.include_tasks: configure/server.yml

- name: configure openvpn client
  when:
    - not running_in_check_mode
    - openvpn_mobile_clients is defined
    - openvpn_mobile_clients | count > 0
  ansible.builtin.include_tasks: configure/client.yml

